double_q_critic:
  _target_: sac.network.DoubleQCritic
  obs_dim: ${agent.obs_dim}
  action_dim: ${agent.action_dim}
  hidden_dim: 256
  hidden_depth: 2

diag_gaussian_actor:
  _target_: sac.network.DiagGaussianActor
  obs_dim: ${agent.obs_dim}
  action_dim: ${agent.action_dim}
  hidden_depth: 2
  hidden_dim: 256
  log_std_bounds: [-5, 2]

name: sac_cn
_target_: sac.agent_cn.SACCNAgent
obs_dim: ??? # to be specified later
action_dim: ??? # to be specified later
action_range: ??? # to be specified later
device: ${device}
critic_cfg: ${agent.double_q_critic}
actor_cfg: ${agent.diag_gaussian_actor}
discount: 0.99
init_temperature: 0.1
alpha_lr: 3e-4
alpha_betas: [0.9, 0.999]
actor_lr: 3e-4
actor_betas: [0.9, 0.999]
actor_update_frequency: 1
critic_lr: 3e-4
critic_betas: [0.9, 0.999]
critic_tau: 0.005
critic_target_update_frequency: 2
batch_size: 256
learnable_temperature: true

# colored-noise exploration (beta=0: white noise / plain SAC, 1: pink, 2: red/OU-like)
num_envs: ${num_envs}
noise_beta: 1.0
noise_seq_len: 1024
noise_seed: ${seed}
