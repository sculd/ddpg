defaults:
  - agent: sac_cn_mountain_car
  - _self_

env: MountainCarContinuous-v0

experiment: sac_cn_exp

# Number of parallel environments (set to 1 for single env, 8+ for speedup)
num_envs: 12

# Number of gradient updates per training step. ignored for single env training.
num_updates_per_step: 6

num_train_steps: 3e5
max_episode_steps: 1000
replay_buffer_capacity: ${num_train_steps}

num_seed_steps: 5000

eval_frequency: 3
num_eval_episodes: 3
target_score: 90

device: cuda

log_frequency: 10000
log_save_tb: true

# Save an mp4 of one deterministic episode every N training episodes (0 = off).
# Videos land in video/train/
render_frequency: 30

# Profiling options (enable independently)
profile_cprofile: false
profile_torch: false

seed: 1

hydra:
  job:
    name: ${env}
  run:
    dir: ./exp
